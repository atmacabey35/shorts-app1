# BilgisayarsÄ±z APK derleme: GitHub'a yÃ¼kle > Actions > "Build APK" > Run workflow
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android iskeletini oluÅŸtur (mevcut dosyalarÄ±n Ã¼zerine yazmaz)
        run: flutter create --platforms=android --org com.example --project-name shorts_studio .

      - name: Manifest ve minSdk 24 (ffmpeg-kit gereksinimi)
        run: |
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle*

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: shorts-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
